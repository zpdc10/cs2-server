// cs2-stack: leaves deathmatch. Copied to <csgo>/cfg/cs2-stack/ on every container start - edit the repo copy.
// Run from MatchZy/warmup_override.cfg and MatchZy/prac_override.cfg, i.e. AFTER MatchZy's warmup.cfg / prac.cfg,
// every time match warmup or practice starts (.match, .prac, loading a scrim, a map change in match mode).
// It must therefore only set cvars that neither warmup.cfg nor prac.cfg set, to the values used outside
// deathmatch (MatchZy's sleep.cfg / live.cfg). Everything else deathmatch.cfg changes is put back by those cfgs
// (and by MatchZy's own unprac commands); knife.cfg and live.cfg set all of them again when a match starts.

matchzy_autostart_mode 1
mp_randomspawn 0
mp_respawn_immunitytime 0
mp_buy_during_immunity 0
mp_ignore_round_win_conditions 0
mp_roundtime_hostage 1.92
mp_round_restart_delay 5
mp_halftime 1
mp_maxrounds 24
mp_give_player_c4 1
mp_teammates_are_enemies 0
mp_friendlyfire 1
