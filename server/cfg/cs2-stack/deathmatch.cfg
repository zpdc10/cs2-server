// cs2-stack: deathmatch settings. Copied to <csgo>/cfg/cs2-stack/ on every container start - edit the repo copy.
// Run from MatchZy/sleep_override.cfg, i.e. after MatchZy's stock sleep.cfg (a full competitive baseline), whenever
// MatchZy enters sleep mode: .dm / css_dm (DeathmatchMode plugin) and every map change while deathmatch is on.
// Only cvars listed in cs2-stack/deathmatch_off.cfg or set by MatchZy's warmup.cfg / prac.cfg may be changed here,
// otherwise .prac / .match would not put them back. Uses the normal competitive game mode: no map reload needed.

// Stay in deathmatch across map changes (MatchZy re-runs its autostart mode on map start; 0 = sleep).
// deathmatch_off.cfg sets it back to 1 (match mode, as in config_override.cfg).
matchzy_autostart_mode 0

// --- Respawning, random spawns (the deathmatch spawn points every Valve map has), 2 s spawn protection
mp_respawn_on_death_ct 1
mp_respawn_on_death_t 1
mp_randomspawn 1
mp_respawn_immunitytime 2
mp_buy_during_immunity 1

// --- Rounds never end by kills; 30 minute rounds that just roll over, no halftime, no match end
mp_ignore_round_win_conditions 1
mp_roundtime 30
mp_roundtime_defuse 30
mp_roundtime_hostage 30
mp_freezetime 0
mp_round_restart_delay 3
mp_halftime 0
mp_maxrounds 0
mp_timelimit 0

// --- Guns: buy anywhere, any time, $16000 every life (the plugin refills on spawn), kevlar + helmet, infinite reserve ammo
mp_buy_anywhere 1
mp_buytime 99999
mp_startmoney 16000
mp_maxmoney 16000
mp_free_armor 2
sv_infinite_ammo 2
mp_death_drop_gun 0
mp_death_drop_grenade 0
mp_death_drop_defuser 0
mp_give_player_c4 0
mp_solid_teammates 1

sv_allow_votes 0   // same as live_override.cfg (MatchZy sleep.cfg turns votes on)

// --- Free for all (the plugin flips these two for ".dm team")
mp_teammates_are_enemies 1
mp_friendlyfire 1

bot_quota 0
sv_cheats 0
mp_warmup_end
css_dm_entered
mp_restartgame 1
