// cs2-stack: MatchZy settings. MatchZy (>= 0.9.x) execs this right after its stock cfg/MatchZy/config.cfg on
// plugin load. Rewritten from server/cfg/MatchZy/config_override.cfg on every container start - edit the repo copy.
// {{...}} placeholders are filled in by server/scripts/install-plugins.sh from the container env.
// URLs MUST stay quoted: unquoted, the CS2 console tokenizer treats "//" as a comment and ":" as a separator.

// --- Startup mode: 1 = match mode (warmup + ready-up). Admins switch with .prac / .match (or RCON css_prac / css_match)
matchzy_autostart_mode 1
matchzy_kick_when_no_match_loaded false
matchzy_whitelist_enabled_default false
matchzy_everyone_is_admin false

// --- Scrim flow: knife round, ready-up
matchzy_knife_enabled_default true
// Players that must .ready before a manual (non-loaded) match starts. Admins can .forceready / .start.
// For matches loaded with matchzy_loadmatch_url the JSON's players_per_team / min_players_to_ready apply.
matchzy_minimum_ready_required 10
matchzy_allow_force_ready true
matchzy_ready_mode 0
matchzy_time_to_start 0

// --- Play out all 24 rounds, but KEEP overtime at 12-12.
// MatchZy's own playout (matchzy_playout_enabled_default / .playout) also forces mp_overtime_enable 0, so it is
// left OFF here. Instead live_override.cfg sets mp_match_can_clinch 0 + mp_overtime_enable 1, and MatchZy's
// playout-off path re-reads those two values from live_override.cfg when the match goes live.
matchzy_playout_enabled_default false

// --- Pauses: .tac = tactical timeout (mp_team_timeout_*), .tech/.pause = technical pause (both teams .unpause)
matchzy_use_pause_command_for_tactical_pause false
matchzy_enable_tech_pause true
matchzy_tech_pause_flag ""
matchzy_max_tech_pauses 0
matchzy_tech_pause_time 0

// --- Round backups / restore (Valve backups are always on via mp_backup_round_auto 1 in live.cfg)
// .stop: if BOTH teams type it, the current round is restored. Admins: .restore <round>.
matchzy_stop_command_available true
matchzy_stop_command_no_damage false
matchzy_pause_after_restore true

// --- Demos: every match is recorded (needs tv_enable 1, set by the image env TV_ENABLE=1)
// Host ${APPDATA}/demos is mounted at <csgo>/MatchZy_demos/ (contract).
matchzy_demo_recording_enabled true
matchzy_demo_path MatchZy_demos/
matchzy_demo_name_format "{TIME}_{MATCH_ID}_{MAP}_{TEAM1}_vs_{TEAM2}"
matchzy_demo_upload_url ""

// --- Events to the web panel (contract)
matchzy_remote_log_url "{{MATCHZY_REMOTE_LOG_URL}}"
matchzy_remote_log_header_key "X-Events-Token"
matchzy_remote_log_header_value "{{MATCHZY_EVENTS_TOKEN}}"

// --- Practice
matchzy_save_nades_as_global_enabled true
matchzy_max_saved_last_grenades 512
matchzy_smoke_color_enabled false

// --- Cosmetics
matchzy_hostname_format ""
matchzy_show_credits_on_match_start false
matchzy_enable_damage_report true
matchzy_reset_cvars_on_series_end true
