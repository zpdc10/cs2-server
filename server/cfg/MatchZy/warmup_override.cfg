// cs2-stack: executed by MatchZy right after its stock cfg/MatchZy/warmup.cfg. Rewritten on every container start.
// Leaving deathmatch: put back what deathmatch.cfg changed and warmup.cfg does not set.
exec cs2-stack/deathmatch_off.cfg
css_dm_exited warmup   // DeathmatchMode plugin: tracks which MatchZy mode is running
mp_roundtime 1.92
mp_roundtime_defuse 1.92
mp_freezetime 15
mp_death_drop_grenade 2
mp_death_drop_defuser 1
