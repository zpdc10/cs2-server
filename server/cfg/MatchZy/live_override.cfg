// cs2-stack: executed by MatchZy right after its stock cfg/MatchZy/live.cfg when a match goes live
// (and re-read for mp_match_can_clinch / mp_overtime_enable). Rewritten on every container start.
// Values follow current Valve competitive / common 5v5 scrim rules: MR12, 1:55 rounds, MR3 overtime.

// --- Format: MR12, play out ALL 24 rounds, overtime at 12-12
mp_maxrounds 24
mp_match_can_clinch 0
mp_overtime_enable 1
mp_overtime_maxrounds 6
mp_overtime_startmoney 12500
mp_overtime_halftime_pausetimer 0
mp_halftime 1
mp_halftime_duration 15
mp_halftime_pausetimer 0
mp_match_end_restart 0

// --- Round timing: 1:55 rounds, 40s bomb, 15s freezetime, 20s buy
mp_roundtime 1.92
mp_roundtime_defuse 1.92
mp_roundtime_hostage 1.92
mp_freezetime 15
mp_buytime 20
mp_c4timer 40
mp_round_restart_delay 7

// --- Economy
mp_startmoney 800
mp_maxmoney 16000

// --- Tactical timeouts (.tac): 3 x 30s per team in regulation, +1 per overtime
mp_team_timeout_max 3
mp_team_timeout_time 30
mp_team_timeout_ot_max 1
mp_team_timeout_ot_add_each 1

// --- Backups for .restore / .stop
mp_backup_round_auto 1
mp_backup_restore_load_autopause 1

// --- Misc
mp_friendlyfire 1
mp_autokick 0
sv_allow_votes 0
sv_hibernate_when_empty 0
